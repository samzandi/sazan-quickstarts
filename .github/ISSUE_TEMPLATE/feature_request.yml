name: Feature request
description: Propose a focused improvement with a clear user need.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Describe the problem this change would solve.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the smallest useful implementation.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: How should maintainers prove the change works?
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Risks and compatibility
      description: Note security, privacy, provider-lock-in, or breaking-change concerns.

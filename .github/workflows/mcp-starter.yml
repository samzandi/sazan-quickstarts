name: MCP Starter CI

on:
  push:
    paths:
      - 'quickstarts/mcp-starter/**'
      - '.github/workflows/mcp-starter.yml'
  pull_request:
    paths:
      - 'quickstarts/mcp-starter/**'
      - '.github/workflows/mcp-starter.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        working-directory: quickstarts/mcp-starter
        run: pip install -r requirements.txt
      - name: Run tests
        working-directory: quickstarts/mcp-starter
        run: python -m unittest discover -s tests -v
      - name: Import server
        working-directory: quickstarts/mcp-starter
        run: python -c "import server; print(server.mcp.name)"

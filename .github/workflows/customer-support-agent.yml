name: Customer Support Agent CI

on:
  push:
    paths:
      - 'quickstarts/customer-support-agent/**'
      - '.github/workflows/customer-support-agent.yml'
  pull_request:
    paths:
      - 'quickstarts/customer-support-agent/**'
      - '.github/workflows/customer-support-agent.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        working-directory: quickstarts/customer-support-agent
        run: python -m unittest discover -s tests -v
      - name: Run demo
        working-directory: quickstarts/customer-support-agent
        run: python app.py

name: test-mcp-starter

on:
  push:
    paths:
      - "quickstarts/mcp-starter/**"
      - ".github/workflows/test-mcp-starter.yml"
  pull_request:
    paths:
      - "quickstarts/mcp-starter/**"
      - ".github/workflows/test-mcp-starter.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MCP SDK
        working-directory: quickstarts/mcp-starter
        run: python -m pip install -r requirements.txt

      - name: Run tests
        working-directory: quickstarts/mcp-starter
        run: python -m unittest discover -s tests -v

      - name: Import server
        working-directory: quickstarts/mcp-starter
        run: python -c "import server; print(server.mcp.name)"

name: test-agent-starter

on:
  push:
    paths:
      - "quickstarts/agent-starter/**"
      - ".github/workflows/test-agent-starter.yml"
  pull_request:
    paths:
      - "quickstarts/agent-starter/**"
      - ".github/workflows/test-agent-starter.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        working-directory: quickstarts/agent-starter
        run: python -m unittest discover -s tests -v

name: Release Gate

on:
  pull_request:
    paths:
      - 'README.md'
      - 'LICENSE'
      - 'docs/**'
      - 'quickstarts/**'
      - 'tools/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate repository structure
        run: python tools/validate_repository.py
      - name: Install release-candidate dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-licenses
          python -m pip install -r quickstarts/agent-starter/requirements.txt
          python -m pip install -r quickstarts/browser-agent/requirements.txt
          python -m pip install -r quickstarts/mcp-starter/requirements.txt
      - name: Record exact resolved dependencies
        run: |
          python -m pip freeze | sort | tee release-dependencies.txt
      - name: Record dependency licenses
        run: |
          pip-licenses --format=json --with-urls --with-license-file --no-license-path > third-party-licenses.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('third-party-licenses.json').read_text())
          print(f'Resolved packages with license metadata: {len(data)}')
          unknown = [x for x in data if not x.get('License') or x.get('License') == 'UNKNOWN']
          print(f'Packages with unknown license metadata: {len(unknown)}')
          if unknown:
              for item in unknown:
                  print(f"UNKNOWN_LICENSE: {item.get('Name')}=={item.get('Version')}")
              raise SystemExit(1)
          PY
      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        with:
          name: v0.1.0-rc.1-release-evidence
          path: |
            release-dependencies.txt
            third-party-licenses.json

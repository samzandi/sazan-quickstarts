name: Coding Agent CI

on:
  push:
    branches:
      - main
      - feature/coding-agent
    paths:
      - 'quickstarts/coding-agent/**'
      - '.github/workflows/coding-agent.yml'
  pull_request:
    paths:
      - 'quickstarts/coding-agent/**'
      - '.github/workflows/coding-agent.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        working-directory: quickstarts/coding-agent
        run: python -m unittest discover -s tests -v
      - name: Run demo
        working-directory: quickstarts/coding-agent
        run: python app.py
